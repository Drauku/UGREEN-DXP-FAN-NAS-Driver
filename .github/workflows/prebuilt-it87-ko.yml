name: Build Prebuilt it87.ko

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Target kernel release (uname -r), e.g. 6.18.38-Unraid'
        required: true
        default: '6.18.38-Unraid'
      kernel_headers_url:
        description: 'URL to a tar/tar.gz/tar.xz/txz archive containing kernel headers/build tree'
        required: true
      kernel_build_path:
        description: 'Optional path inside extracted archive to kernel build dir (contains top-level Makefile)'
        required: false
        default: ''
      build_mode:
        description: 'Module build mode'
        required: true
        type: choice
        options:
          - prod
          - dev
        default: prod

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KERNEL_VERSION: ${{ github.event.inputs.kernel_version }}
      HEADERS_URL: ${{ github.event.inputs.kernel_headers_url }}
      KERNEL_BUILD_PATH_INPUT: ${{ github.event.inputs.kernel_build_path }}
      BUILD_MODE: ${{ github.event.inputs.build_mode }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            file \
            kmod \
            xz-utils

      - name: Download and extract kernel headers
        id: headers
        run: |
          set -euo pipefail
          WORKDIR="$RUNNER_TEMP/kernel-headers"
          ARCHIVE="$WORKDIR/headers.pkg"
          EXTRACTED="$WORKDIR/extracted"
          mkdir -p "$WORKDIR" "$EXTRACTED"

          is_private_ipv4() {
            local ip="$1"
            case "$ip" in
              10.*|127.*|169.254.*|192.168.*) return 0 ;;
              172.1[6-9].*|172.2[0-9].*|172.3[0-1].*) return 0 ;;
            esac
            return 1
          }

          is_private_ipv6() {
            local ip="${1,,}"
            case "$ip" in
              ::1|0:0:0:0:0:0:0:1) return 0 ;;
              fc*|fd*) return 0 ;;                  # unique local (fc00::/7)
              fe8*|fe9*|fea*|feb*) return 0 ;;     # link-local (fe80::/10)
            esac
            return 1
          }

          validate_headers_url() {
            local url="$1"
            [[ "$url" =~ ^https:// ]] || {
              echo "Only https:// URLs are allowed for kernel_headers_url." >&2
              return 1
            }

            local host
            host="$(printf '%s\n' "$url" | sed -E 's#^https://([^/:]+).*#\1#')"
            [ -n "$host" ] || {
              echo "Could not parse host from kernel_headers_url." >&2
              return 1
            }

            case "$host" in
              localhost|*.localhost)
                echo "Localhost targets are not allowed for kernel_headers_url." >&2
                return 1
                ;;
            esac

            local ips_v4 ips_v6 ips
            ips_v4="$(getent ahostsv4 "$host" | awk '{print $1}' | sort -u || true)"
            ips_v6="$(getent ahostsv6 "$host" | awk '{print $1}' | sort -u || true)"
            ips="$(printf '%s\n%s\n' "$ips_v4" "$ips_v6" | sed '/^$/d' | sort -u)"
            [ -n "$ips" ] || {
              echo "Could not resolve host '$host'." >&2
              return 1
            }

            local ip
            for ip in $ips; do
              if [[ "$ip" == *:* ]]; then
                if is_private_ipv6 "$ip"; then
                  echo "kernel_headers_url resolved to private/local IPv6 address '$ip', rejecting." >&2
                  return 1
                fi
              else
                if is_private_ipv4 "$ip"; then
                  echo "kernel_headers_url resolved to private/local IPv4 address '$ip', rejecting." >&2
                  return 1
                fi
              fi
            done
          }

          validate_headers_url "$HEADERS_URL"
          curl -fL "$HEADERS_URL" -o "$ARCHIVE"

          if tar -tf "$ARCHIVE" >/dev/null 2>&1; then
            tar -xf "$ARCHIVE" -C "$EXTRACTED"
          else
            case "$HEADERS_URL" in
              *.tar.gz|*.tgz) tar -xzf "$ARCHIVE" -C "$EXTRACTED" ;;
              *.tar.xz|*.txz) tar -xJf "$ARCHIVE" -C "$EXTRACTED" ;;
              *.tar) tar -xf "$ARCHIVE" -C "$EXTRACTED" ;;
              *)
                echo "Unsupported archive type and auto-detection failed: $HEADERS_URL" >&2
                exit 1
                ;;
            esac
          fi

          resolve_kernel_build_dir() {
            local base="$1"
            local requested="${2:-}"
            is_valid_kernel_build_dir() {
              local dir="$1"
              [ -d "$dir" ] &&
              [ -f "$dir/Makefile" ] &&
              [ -d "$dir/include/linux" ] &&
              [ -f "$dir/Kconfig" ] &&
              [ -d "$dir/scripts" ]
            }

            if [ -n "$requested" ]; then
              if is_valid_kernel_build_dir "$base/$requested"; then
                echo "$base/$requested"
                return 0
              fi
              echo "kernel_build_path '$requested' is not a valid kernel build directory" >&2
              return 1
            fi

            local from_modules="$base/lib/modules/$KERNEL_VERSION/build"
            if is_valid_kernel_build_dir "$from_modules"; then
              echo "$from_modules"
              return 0
            fi

            while IFS= read -r candidate; do
              if is_valid_kernel_build_dir "$candidate"; then
                echo "$candidate"
                return 0
              fi
            done < <(find "$base" -maxdepth 6 -type f -name Makefile | sed 's#/Makefile$##' | grep -E '/(build|linux-headers|headers)[^/]*$' || true)

            return 1
          }

          KBUILD_DIR="$(resolve_kernel_build_dir "$EXTRACTED" "$KERNEL_BUILD_PATH_INPUT")"
          if [ -z "$KBUILD_DIR" ]; then
            echo "Could not locate a usable kernel build directory in downloaded headers." >&2
            echo "Provide kernel_build_path explicitly (path relative to archive root)." >&2
            exit 1
          fi

          echo "kbuild_dir=$KBUILD_DIR" >> "$GITHUB_OUTPUT"
          echo "headers_root=$EXTRACTED" >> "$GITHUB_OUTPUT"

      - name: Build it87.ko
        run: |
          set -euo pipefail
          make -C it87 clean || true
          make -C it87 \
            TARGET="$KERNEL_VERSION" \
            KERNEL_BUILD="${{ steps.headers.outputs.kbuild_dir }}" \
            BUILD="$BUILD_MODE"

      - name: Collect artifacts
        run: |
          set -euo pipefail
          OUT_DIR="$RUNNER_TEMP/artifacts"
          mkdir -p "$OUT_DIR"
          cp it87/it87.ko "$OUT_DIR/"
          modinfo "$OUT_DIR/it87.ko" > "$OUT_DIR/modinfo.txt"
          printf '%s\n' "$KERNEL_VERSION" > "$OUT_DIR/kernel-version.txt"
          printf '%s\n' "${{ steps.headers.outputs.kbuild_dir }}" > "$OUT_DIR/kernel-build-dir.txt"
          sha256sum "$OUT_DIR/it87.ko" > "$OUT_DIR/it87.ko.sha256"
          ls -lah "$OUT_DIR"

      - name: Upload prebuilt module
        uses: actions/upload-artifact@v4
        with:
          name: it87-ko-${{ github.event.inputs.kernel_version }}
          path: ${{ runner.temp }}/artifacts/*
          if-no-files-found: error
